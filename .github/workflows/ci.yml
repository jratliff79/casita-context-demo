name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/output/python-cache
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  native-git:
    name: Native Git example
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal
      - name: Test native Git artifact controls
        run: >-
          cargo +1.94.1 test --locked
          --manifest-path examples/native-git/Cargo.toml
          --target-dir output/native-git-build
      - name: Run synthetic native Git checks
        run: >-
          cargo +1.94.1 run --locked
          --manifest-path examples/native-git/Cargo.toml
          --target-dir output/native-git-build
          -- --output output/native-git-demo

  handoff:
    name: Casita handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install tested uv runner
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.22'
          enable-cache: false
      - name: Check out tested Casita source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: cachix/casita
          ref: 84ec2920791276cd4ad8c029cd60529810e15705
          path: output/casita-source
          persist-credentials: false
      - name: Check out immutable public review source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: jratliff79/casita-context-demo
          ref: de2c03a89ceef6a0b751ed137c91a4710dccaf19
          path: output/review-source
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal
      - name: Check out immutable selected-Git review source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: jratliff79/casita-context-demo
          ref: 5cc171423d293ad5ca6b2e5323718d4f699e1136
          path: output/git-review-source
          persist-credentials: false
      - name: Install CI dependency snapshot
        run: cp ci/Cargo.lock output/casita-source/Cargo.lock
      - name: Check out immutable public diff source and its history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: jratliff79/casita-context-demo
          ref: 002fe4d138a4b17f972dec7639ddda5a4eb62d70
          fetch-depth: 0
          path: output/git-diff-source
          persist-credentials: false
      - name: Check out immutable public context-request review source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: jratliff79/casita-context-demo
          ref: 133459e56fce11e93358a6f1b9b1b9cff9985a5b
          fetch-depth: 0
          path: output/context-request-review-source
          persist-credentials: false
      - name: Build Casita with locked dependencies
        run: >-
          cargo +1.94.1 build --locked --package casita --bin casita
          --manifest-path output/casita-source/Cargo.toml
          --target-dir output/casita-build
      - name: Check out immutable recorded diff review source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: jratliff79/casita-context-demo
          ref: 0e01f69d661837eb5073fde11a1c7fd03d3702b3
          fetch-depth: 0
          path: output/diff-review-source
          persist-credentials: false
      - name: Stage disposable fixtures and generate a cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          work = Path("output/ci-worktree")
          for name in ("demo.py", "handoff.py", "authentication.py", "signed_handoff.py", "fixtures/source/verify.py",
                       "fixtures/v1/observation.json", "fixtures/v1/task.md",
                       "fixtures/v2/observation.json", "fixtures/v2/task.md"):
              target = work / name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(name, target)
          PY
          python -m py_compile output/ci-worktree/fixtures/source/verify.py
      - name: Run uv quick start with fresh stores
        run: >-
          uv run --no-project --python 3.12 python output/ci-worktree/demo.py
          --casita output/casita-build/debug/casita
          --output output/ci-handoff
      - name: Check receipt and exact restored file sets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          folder = Path("output/ci-handoff")
          receipt = json.loads((folder / "receipt.json").read_text())
          assert receipt["ok"] and receipt["tampered_context_rejected"]
          commands = receipt["commands"]
          assert all(c["exit_code"] == 0 for c in commands)
          pins = receipt["pins"]
          mappings = receipt["archive_import"]["mappings"]
          assert len(mappings) == 2
          assert {m["root"] for m in mappings} == {
              pins[version]["directory_key"] for version in ("v1", "v2")
          }
          assert list(Path("output/ci-worktree/fixtures/source/__pycache__").glob("*.pyc"))
          for version in ("v1", "v2"):
              restored = folder / "received" / version
              files = {p.relative_to(restored).as_posix()
                       for p in restored.rglob("*") if p.is_file()}
              assert files == {"source/verify.py", "observation.json",
                               "task.md", "manifest.json"}, files
          returned = receipt["result_return"]
          assert returned["received_code_executed"] is False
          assert returned["sandbox_tested"] is False and returned["execution_attested"] is False
          assert returned["negative_controls"] == {
              "altered_result_rejected": True,
              "rebound_result_rejected": True,
              "result_for_other_context_rejected": True,
          }
          assert returned["verdicts"] == {
              "v1": "rejected: source or output audio timing unavailable",
              "v2": "accepted",
          }
          result_mappings = returned["archive_import"]["mappings"]
          assert len(result_mappings) == 2
          assert {m["root"] for m in result_mappings} == {
              returned["pins"][v]["directory_key"] for v in ("v1", "v2")
          }
          for version in ("v1", "v2"):
              result_folder = folder / "returned" / version
              assert {p.name for p in result_folder.iterdir()} == {"result.json"}
              result = json.loads((result_folder / "result.json").read_text())
              assert result["context_id"] == pins[version]["context_id"]
              assert result["context_directory_key"] == pins[version]["directory_key"]
          order = [m["root"] for m in mappings]
          reversed_order = order == [pins["v2"]["directory_key"], pins["v1"]["directory_key"]]
          print(f"PASS: {len(commands)} commands, context/result roots, exact files, cache exclusion and negative controls")
          print(f"Observed reversed import order: {reversed_order}")
          PY
      - name: Run separate sender, worker and return-verifier processes
        run: |
          python output/ci-worktree/handoff.py prepare --casita output/casita-build/debug/casita --output output/portable-sender
          python output/ci-worktree/handoff.py work --casita output/casita-build/debug/casita --archive output/portable-sender/handoff.casitar --pins output/portable-sender/pins.json --output output/portable-worker
          python output/ci-worktree/handoff.py verify --casita output/casita-build/debug/casita --archive output/portable-worker/handoff.casitar --pins output/portable-worker/pins.json --original output/portable-sender --output output/portable-return
          python - <<'PY'
          import json
          from pathlib import Path
          for role in ("sender", "worker", "return"):
              receipt = json.loads(Path(f"output/portable-{role}/receipt.json").read_text())
              assert receipt["ok"] and all(c["exit_code"] == 0 for c in receipt["commands"])
          worker = json.loads(Path("output/portable-worker/receipt.json").read_text())
          assert worker["verdicts"] == {"v1": "rejected: source or output audio timing unavailable", "v2": "accepted"}
          assert worker["received_code_executed"] is False and worker["execution_attested"] is False
          returned = json.loads(Path("output/portable-return/receipt.json").read_text())
          assert returned["original_contexts_verified"]
          print("PASS: separate-process portable handoff and original-context result verification")
          PY

      - name: Run authenticated input and result handoff
        run: |
          python output/ci-worktree/signed_handoff.py --casita output/casita-build/debug/casita --output output/signed-handoff
          python - <<'PY'
          import json
          from pathlib import Path
          folder = Path("output/signed-handoff")
          receipt = json.loads((folder / "receipt.json").read_text())
          assert receipt["ok"] and receipt["original_contexts_verified"]
          assert receipt["input_authentication"]["verified"] and receipt["result_authentication"]["verified"]
          assert receipt["unsigned_replacement_accepted"] and receipt["throwaway_private_keys_removed"]
          assert receipt["negative_controls"] == {
              "replaced_archive_and_pins": True, "unknown_signing_key": True,
              "wrong_namespace": True, "wrong_identity": True,
          }
          assert not (folder / "throwaway-keys").exists()
          assert receipt["received_code_executed"] is False and receipt["execution_attested"] is False
          assert receipt["verdicts"] == {"v1": "rejected: source or output audio timing unavailable", "v2": "accepted"}
          print("PASS: signed pins, original-context result verification and pre-import signature controls")
          PY

      - name: Replay recorded AI review through signed source and result capsules
        run: |
          python review_replay.py --casita output/casita-build/debug/casita --source output/review-source --report docs/review-report.json --output output/review-replay
          python - <<'PY'
          import json
          from pathlib import Path
          folder = Path("output/review-replay")
          receipt = json.loads((folder / "receipt.json").read_text())
          assert receipt["ok"] and receipt["original_context_verified"] and receipt["citations_verified"]
          assert receipt["input_signature_verified"] and receipt["result_signature_verified"]
          assert receipt["fresh_ai_review"] is False and receipt["review_quality_verified"] is False
          assert receipt["execution_attested"] is False
          assert receipt["finding_count"] == 1
          assert receipt["negative_controls"] == {"wrong_context": True, "invented_excerpt": True}
          assert receipt["throwaway_private_keys_removed"] and not (folder / "throwaway-keys").exists()
          for mode in ("sender", "receiver", "reviewer-return", "verified-return"):
              role = json.loads((folder / mode / "receipt.json").read_text())
              assert role["ok"] and all(c["exit_code"] == 0 for c in role["commands"])
          print("PASS: recorded AI report, signed source/result transport, exact citations and signed invalid-report controls")
          PY

      - name: Run synthetic selected-Git-lines review handoff
        run: |
          python git_review_example.py --casita output/casita-build/debug/casita --output output/git-review-example
          python - <<'PY'
          import json
          from pathlib import Path
          folder = Path("output/git-review-example")
          receipt = json.loads((folder / "receipt.json").read_text())
          assert receipt["ok"] and receipt["synthetic_fixture"]
          assert receipt["fresh_ai_review"] is False and receipt["review_quality_verified"] is False
          assert receipt["received_code_executed"] is False and receipt["execution_attested"] is False
          assert receipt["os_sandbox_enforced"] is False
          assert receipt["original_git_verified"] and receipt["citations_verified"]
          assert receipt["input_signature_verified"] and receipt["result_signature_verified"]
          assert receipt["working_tree_data_excluded"] and receipt["finding_count"] == 1
          assert receipt["negative_controls"] == {
              "wrong_context": True, "wrong_commit": True, "invented_excerpt": True,
              "wrong_blob": True, "uncaptured_lines": True, "modified_pins_before_import": True,
          }
          assert receipt["throwaway_private_keys_removed"] and not (folder / "throwaway-keys").exists()
          for name in ("sender", "receiver", "reviewer-return", "verified-return"):
              role = json.loads((folder / name / "receipt.json").read_text())
              assert role["ok"] and all(c["exit_code"] == 0 for c in role["commands"])
          assert not (folder / "rejected-modified-pins/store").exists()
          print("PASS: synthetic Git selections, signed round trip, exact citations and rejection controls")
          PY

      - name: Replay the public selected-Git capsule review
        run: |
          python git_review_replay.py --casita output/casita-build/debug/casita --source output/git-review-source --output output/public-git-review-replay
          python - <<'PY'
          import json
          from pathlib import Path
          folder = Path("output/public-git-review-replay")
          receipt = json.loads((folder / "receipt.json").read_text())
          assert receipt["ok"] and receipt["public_source_snapshot"]
          assert receipt["synthetic_fixture"] is False and receipt["fresh_ai_review"] is False
          assert receipt["review_quality_verified"] is False and receipt["execution_attested"] is False
          assert receipt["received_code_executed"] is False and receipt["os_sandbox_enforced"] is False
          assert receipt["original_git_verified"] and receipt["citations_verified"]
          assert receipt["input_signature_verified"] and receipt["result_signature_verified"]
          assert receipt["finding_count"] == 1
          assert receipt["negative_controls"] == {
              "wrong_context": True, "wrong_commit": True, "invented_excerpt": True,
              "wrong_blob": True, "uncaptured_lines": True,
          }
          assert receipt["throwaway_private_keys_removed"] and not (folder / "throwaway-keys").exists()
          for name in ("sender", "receiver", "reviewer-return", "verified-return"):
              role = json.loads((folder / name / "receipt.json").read_text())
              assert role["ok"] and all(c["exit_code"] == 0 for c in role["commands"])
          print("PASS: recorded public Git review, signed return, original Git citations and rejection controls")
          PY

      - name: Run the public base/head diff review handoff
        run: |
          python git_diff_example.py --casita output/casita-build/debug/casita --source output/git-diff-source --output output/git-diff-example
          python - <<'PY'
          import json
          from pathlib import Path
          folder = Path("output/git-diff-example")
          receipt = json.loads((folder / "receipt.json").read_text())
          assert receipt["ok"] and receipt["public_source_snapshot"] and receipt["scripted_report"]
          assert receipt["synthetic_fixture"] is False and receipt["fresh_ai_review"] is False
          assert receipt["review_quality_verified"] is False and receipt["execution_attested"] is False
          assert receipt["received_code_executed"] is False and receipt["patch_applied"] is False
          assert receipt["os_sandbox_enforced"] is False
          assert receipt["original_git_verified"] and receipt["citations_verified"]
          assert receipt["input_signature_verified"] and receipt["result_signature_verified"]
          assert receipt["base_commit"] == "5cc171423d293ad5ca6b2e5323718d4f699e1136"
          assert receipt["head_commit"] == "002fe4d138a4b17f972dec7639ddda5a4eb62d70"
          assert receipt["negative_controls"] == {
              "wrong_base": True, "wrong_head": True, "wrong_version": True,
              "invented_excerpt": True, "wrong_blob": True, "uncaptured_lines": True,
              "rebound_signed_diff": True,
          }
          assert receipt["throwaway_private_keys_removed"] and not (folder / "throwaway-keys").exists()
          for name in ("sender", "receiver", "reviewer-return", "verified-return"):
              role = json.loads((folder / name / "receipt.json").read_text())
              assert role["ok"] and all(c["exit_code"] == 0 for c in role["commands"])
          print("PASS: public diff, both original commits, signed return and versioned citations")
          PY

      - name: Preview explicit public diff scope and restore its generated spec
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import authentication as auth

          root = Path("output/scope-preview-check")
          root.mkdir(mode=0o700)
          source = Path("output/git-diff-source")
          binary = "output/casita-build/debug/casita"
          def command(script, *args):
              subprocess.check_call([sys.executable, script, *map(str, args)])
          command("git_diff_plan.py", "--source", source,
              "--base", "5cc171423d293ad5ca6b2e5323718d4f699e1136",
              "--head", "002fe4d138a4b17f972dec7639ddda5a4eb62d70",
              "--path", "git_review.py", "--path", "review_handoff.py", "--path", "LICENSE",
              "--source-label", "Public MIT source from PR 15",
              "--purpose", "Review the report and archive size guards; identify missing context.",
              "--output", root / "preview")
          preview = json.loads((root / "preview/preview.json").read_text())
          assert preview["selected_line_count"] == 230 and len(preview["selections"]) == 6
          assert preview["signed"] is False and preview["casita_store_created"] is False
          keys = root / "throwaway-keys"
          keys.mkdir(mode=0o700)
          try:
              auth.make_demo_key(keys / "sender")
              auth.provision_demo_signer(keys / "sender", root / "allowed-signers",
                                        "scope-preview-sender", "review-input")
              command("git_diff_review.py", "prepare", "--source", source,
                  "--spec", root / "preview/spec.json", "--casita", binary,
                  "--signing-key", keys / "sender", "--output", root / "sender")
              pins = json.loads((root / "sender/pins.json").read_text())
              assert pins["content_id"] == preview["content_id"]
              command("git_diff_review.py", "receive", "--casita", binary,
                  "--archive", root / "sender/handoff.casitar", "--pins", root / "sender/pins.json",
                  "--signature", root / "sender/pins.sig", "--allowed-signers", root / "allowed-signers",
                  "--signer", "scope-preview-sender", "--output", root / "receiver")
              assert json.loads((root / "receiver/receipt.json").read_text())["signature_verified"]
              for path in (root / "preview/context").rglob("*"):
                  if path.is_file():
                      restored = root / "receiver/context" / path.relative_to(root / "preview/context")
                      assert restored.read_bytes() == path.read_bytes()
          finally:
              shutil.rmtree(keys)
          assert not keys.exists()
          print("PASS: generated spec restores the exact previewed context; throwaway keys removed")
          PY

      - name: Run synthetic missing-context request and signed supplement
        run: |
          python context_request_example.py --casita output/casita-build/debug/casita --output output/context-request
          python - <<'PYCODE'
          import json
          from pathlib import Path
          root = Path("output/context-request")
          receipt = json.loads((root / "receipt.json").read_text())
          assert receipt["ok"] and receipt["synthetic_fixture"] and receipt["scripted_report"]
          assert receipt["fresh_ai_review"] is False and receipt["received_code_executed"] is False
          assert receipt["input_signatures_verified"] and receipt["returned_reports_verified"]
          assert receipt["citations_verified"] and receipt["binding"]["request_binding_verified"]
          assert receipt["initial_finding_count"] == 0 and receipt["final_finding_count"] == 1
          assert len(receipt["negative_controls"]) == 6 and all(receipt["negative_controls"].values())
          assert receipt["dirty_checkout_excluded"] and receipt["throwaway_private_keys_removed"]
          assert not (root / "throwaway-keys").exists()
          print("PASS: synthetic request, approved supplement and rejected wrong bindings")
          PYCODE

      - name: Run an unchanged-helper-only signed supplement
        run: |
          python context_request_example.py --helpers-only --casita output/casita-build/debug/casita --output output/helpers-only
          python - <<'PYCODE'
          import json
          from pathlib import Path
          root = Path("output/helpers-only")
          receipt = json.loads((root / "receipt.json").read_text())
          assert receipt["ok"] and receipt["helpers_only_supplement"]
          assert receipt["only_approved_helper_source"] and receipt["supplement_selected_line_count"] == 12
          assert receipt["input_signatures_verified"] and receipt["returned_reports_verified"]
          assert receipt["citations_verified"] and receipt["final_citation_count"] == 1
          assert receipt["binding"]["request_binding_verified"]
          assert len(receipt["negative_controls"]) == 7 and all(receipt["negative_controls"].values())
          manifest = json.loads((root / "supplement-receiver/context/manifest.json").read_text())
          assert manifest["schema"] == "casita-context-demo.git-diff-supplement-context.v1"
          assert receipt["received_code_executed"] is False and receipt["fresh_ai_review"] is False
          assert receipt["dirty_checkout_excluded"] and receipt["throwaway_private_keys_removed"]
          assert not (root / "throwaway-keys").exists()
          print("PASS: unchanged helper only, bound parent/request and signed false-source rejection")
          PYCODE

      - name: Replay the recorded public context request and reassessment
        run: |
          python context_request_replay.py --source output/context-request-review-source --casita output/casita-build/debug/casita --output output/recorded-context-request
          python - <<'PYCODE'
          import json
          from pathlib import Path
          root = Path("output/recorded-context-request")
          receipt = json.loads((root / "receipt.json").read_text())
          assert receipt["ok"] and receipt["public_source_snapshot"] and receipt["recorded_ai_reports"]
          assert receipt["scripted_report"] is False and receipt["fresh_ai_review"] is False
          assert receipt["received_code_executed"] is False and receipt["review_quality_verified"] is False
          assert receipt["input_signatures_verified"] and receipt["returned_signatures_verified"]
          assert receipt["original_git_verified"] and receipt["citations_verified"]
          assert receipt["binding"]["request_binding_verified"]
          assert receipt["initial_finding_count"] == 0 and receipt["final_finding_count"] == 1
          assert receipt["initial_citation_count"] == 0 and receipt["final_citation_count"] == 4
          assert len(receipt["negative_controls"]) == 6 and all(receipt["negative_controls"].values())
          assert receipt["throwaway_private_keys_removed"] and not (root / "throwaway-keys").exists()
          print("PASS: recorded request and reassessment bindings; no model or finding-quality claim")
          PYCODE

      - name: Replay the recorded empty public diff review
        run: |
          python git_diff_replay.py --casita output/casita-build/debug/casita --source output/diff-review-source --output output/recorded-diff-review
          python - <<'PY'
          import json
          from pathlib import Path
          folder = Path("output/recorded-diff-review")
          receipt = json.loads((folder / "receipt.json").read_text())
          assert receipt["ok"] and receipt["public_source_snapshot"] and receipt["recorded_ai_report"]
          assert receipt["scripted_report"] is False and receipt["fresh_ai_review"] is False
          assert receipt["review_quality_verified"] is False and receipt["execution_attested"] is False
          assert receipt["received_code_executed"] is False and receipt["patch_applied"] is False
          assert receipt["os_sandbox_enforced"] is False
          assert receipt["original_git_verified"] and receipt["citations_verified"]
          assert receipt["input_signature_verified"] and receipt["result_signature_verified"]
          assert receipt["finding_count"] == 0 and receipt["citation_count"] == 0
          assert receipt["context_pins"]["content_id"] == "447199974f6217e55b5c8ded266234c82b0fdaa3fd70621e610ea95ffced2839"
          assert receipt["negative_controls"] == {
              "wrong_base": True, "wrong_head": True, "wrong_version": True,
              "invented_excerpt": True, "wrong_blob": True, "uncaptured_lines": True,
              "rebound_signed_diff": True,
          }
          assert receipt["throwaway_private_keys_removed"] and not (folder / "throwaway-keys").exists()
          assert (folder / "verified-return/result/report.json").read_bytes() == Path("docs/diff-review-report.json").read_bytes()
          for name in ("sender", "receiver", "reviewer-return", "verified-return"):
              role = json.loads((folder / name / "receipt.json").read_text())
              assert role["ok"] and all(c["exit_code"] == 0 for c in role["commands"])
          print("PASS: recorded empty report unchanged, both source commits and independent controls")
          PY

  environment:
    name: OCI environment transport
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check out tested Casita source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: cachix/casita
          ref: 84ec2920791276cd4ad8c029cd60529810e15705
          path: output/casita-source
          persist-credentials: false
      - name: Install pinned Rust toolchain and dependency snapshot
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          cp ci/Cargo.lock output/casita-source/Cargo.lock
      - name: Build Casita with OCI support and locked dependencies
        run: >-
          cargo +1.94.1 build --locked --package casita --bin casita --features oci
          --manifest-path output/casita-source/Cargo.toml
          --target-dir output/casita-build
      - name: Restore pinned public image and synthetic contexts into a fresh store
        run: >-
          python environment.py --casita output/casita-build/debug/casita
          --output output/environment-handoff --platform linux/amd64 --runtime none
      - name: Check transport scope and pre-runtime rejection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path("output/environment-handoff/receipt.json").read_text())
          assert receipt["ok"] and receipt["image_layout_verified"]
          assert receipt["original_contexts_verified"]
          assert receipt["wrong_image_pin_rejected_before_runtime"]
          assert receipt["worker_executed_in_container"] is False
          assert receipt["received_checker_executed"] is False
          assert receipt["execution_attested"] is False and receipt["runtime_commands"] == []
          assert all(c["exit_code"] == 0 for c in receipt["commands"])
          print("PASS: OCI image/context transport and trusted host check; no container runtime executed")
          PY
