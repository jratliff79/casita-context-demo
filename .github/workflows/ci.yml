name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/output/python-cache
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  native-git:
    name: Native Git example
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal
      - name: Test native Git artifact controls
        run: >-
          cargo +1.94.1 test --locked
          --manifest-path examples/native-git/Cargo.toml
          --target-dir output/native-git-build
      - name: Run synthetic native Git checks
        run: >-
          cargo +1.94.1 run --locked
          --manifest-path examples/native-git/Cargo.toml
          --target-dir output/native-git-build
          -- --output output/native-git-demo

  handoff:
    name: Casita handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install tested uv runner
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.22'
          enable-cache: false
      - name: Check out tested Casita source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: cachix/casita
          ref: 1407672f4b235609ae7fff0f87a30e06183f941f
          path: output/casita-source
          persist-credentials: false
      - name: Check out immutable public review source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: jratliff79/casita-context-demo
          ref: de2c03a89ceef6a0b751ed137c91a4710dccaf19
          path: output/review-source
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal
      - name: Check out immutable selected-Git review source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: jratliff79/casita-context-demo
          ref: 5cc171423d293ad5ca6b2e5323718d4f699e1136
          path: output/git-review-source
          persist-credentials: false
      - name: Install CI dependency snapshot
        run: cp ci/Cargo.lock output/casita-source/Cargo.lock
      - name: Check out immutable public docs checkpoint source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: jratliff79/casita-context-demo
          ref: 50b6820203f431026cd25385e6bd2a0cd6a59cea
          path: output/docs-checkpoint-source
          persist-credentials: false
      - name: Check out immutable public diff source and its history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: jratliff79/casita-context-demo
          ref: 002fe4d138a4b17f972dec7639ddda5a4eb62d70
          fetch-depth: 0
          path: output/git-diff-source
          persist-credentials: false
      - name: Check out immutable public context-request review source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: jratliff79/casita-context-demo
          ref: 133459e56fce11e93358a6f1b9b1b9cff9985a5b
          fetch-depth: 0
          path: output/context-request-review-source
          persist-credentials: false
      - name: Build Casita with locked dependencies
        run: >-
          cargo +1.94.1 build --locked --package casita --bin casita
          --manifest-path output/casita-source/Cargo.toml
          --target-dir output/casita-build
      - name: Check out immutable recorded diff review source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: jratliff79/casita-context-demo
          ref: 0e01f69d661837eb5073fde11a1c7fd03d3702b3
          fetch-depth: 0
          path: output/diff-review-source
          persist-credentials: false
      - name: Stage disposable fixtures and generate a cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          work = Path("output/ci-worktree")
          for name in ("demo.py", "handoff.py", "authentication.py", "signed_handoff.py", "fixtures/source/verify.py",
                       "fixtures/v1/observation.json", "fixtures/v1/task.md",
                       "fixtures/v2/observation.json", "fixtures/v2/task.md"):
              target = work / name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(name, target)
          PY
          python -m py_compile output/ci-worktree/fixtures/source/verify.py
      - name: Run uv quick start with fresh stores
        run: >-
          uv run --no-project --python 3.12 python output/ci-worktree/demo.py
          --casita output/casita-build/debug/casita
          --output output/ci-handoff
      - name: Check receipt and exact restored file sets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          folder = Path("output/ci-handoff")
          receipt = json.loads((folder / "receipt.json").read_text())
          assert receipt["ok"] and receipt["tampered_context_rejected"]
          commands = receipt["commands"]
          assert all(c["exit_code"] == 0 for c in commands)
          pins = receipt["pins"]
          mappings = receipt["archive_import"]["mappings"]
          assert len(mappings) == 2
          assert {m["root"] for m in mappings} == {
              pins[version]["directory_key"] for version in ("v1", "v2")
          }
          assert list(Path("output/ci-worktree/fixtures/source/__pycache__").glob("*.pyc"))
          for version in ("v1", "v2"):
              restored = folder / "received" / version
              files = {p.relative_to(restored).as_posix()
                       for p in restored.rglob("*") if p.is_file()}
              assert files == {"source/verify.py", "observation.json",
                               "task.md", "manifest.json"}, files
          returned = receipt["result_return"]
          assert returned["received_code_executed"] is False
          assert returned["sandbox_tested"] is False and returned["execution_attested"] is False
          assert returned["negative_controls"] == {
              "altered_result_rejected": True,
              "rebound_result_rejected": True,
              "result_for_other_context_rejected": True,
          }
          assert returned["verdicts"] == {
              "v1": "rejected: source or output audio timing unavailable",
              "v2": "accepted",
          }
          result_mappings = returned["archive_import"]["mappings"]
          assert len(result_mappings) == 2
          assert {m["root"] for m in result_mappings} == {
              returned["pins"][v]["directory_key"] for v in ("v1", "v2")
          }
          for version in ("v1", "v2"):
              result_folder = folder / "returned" / version
              assert {p.name for p in result_folder.iterdir()} == {"result.json"}
              result = json.loads((result_folder / "result.json").read_text())
              assert result["context_id"] == pins[version]["context_id"]
              assert result["context_directory_key"] == pins[version]["directory_key"]
          order = [m["root"] for m in mappings]
          reversed_order = order == [pins["v2"]["directory_key"], pins["v1"]["directory_key"]]
          print(f"PASS: {len(commands)} commands, context/result roots, exact files, cache exclusion and negative controls")
          print(f"Observed reversed import order: {reversed_order}")
          PY
      - name: Restore synthetic build artifacts without rebuilding
        run: |
          uv run --no-project --python 3.12 python artifacts.py --casita output/casita-build/debug/casita --output output/build-artifacts
          python - <<'PY'
          import json
          from pathlib import Path
          from demo import file_map

          root = Path("output/build-artifacts")
          receipt = json.loads((root / "receipt.json").read_bytes())
          assert receipt["ok"] and receipt["synthetic"]
          assert receipt["local_build_count"] == 2 and not receipt["receiver_rebuilt"]
          assert not receipt["received_code_executed"]
          assert not receipt["execution_attested"] and not receipt["build_provenance_attested"]
          assert receipt["original_sources_and_builds_removed"]
          assert not (root / "sources").exists() and not (root / "builds").exists()
          assert receipt["rollback_verified"] and receipt["integrity_audits_passed"]
          assert len(receipt["negative_controls"]) == 5 and all(receipt["negative_controls"].values())
          assert all(command["exit_code"] == 0 for command in receipt["commands"])
          for version in ("v1", "v2"):
              assert file_map(root / "received" / version) == receipt["original_file_hashes"][version]
          assert file_map(root / "received/rollback") == receipt["original_file_hashes"]["v1"]
          print("PASS: exact artifact versions and rollback without received-code execution or rebuilding")
          PY
      - name: Sync and select a synthetic offline event kit
        run: |
          uv run --no-project --python 3.12 python event_kit.py --casita output/casita-build/debug/casita --output output/event-kit
          python - <<'PY'
          import json
          from pathlib import Path
          from demo import file_map

          root = Path("output/event-kit")
          receipt = json.loads((root / "receipt.json").read_bytes())
          assert receipt["ok"] and receipt["synthetic"] and receipt["scripted_selection"]
          assert not receipt["eventools_integration"] and not receipt["network_isolation_enforced"]
          assert not receipt["received_code_executed"] and not receipt["media_played"]
          assert not receipt["execution_attested"]
          assert receipt["sender_path_unavailable"] and not (root / "sender-store").exists()
          assert not (root / "kits").exists() and (root / "sender-store-unavailable").is_dir()
          assert receipt["old_selection_preserved_until_verified_update"]
          assert not (root / "rejected-stale").exists()
          assert receipt["venue_only_restoration_verified"] and receipt["venue_integrity_audit_passed"]
          assert receipt["welcome_time"] == "18:15"
          assert receipt["selected_directory_key"] == receipt["pins"]["v2"]["directory_key"]
          assert 0 < receipt["sync_payloads_sent"]["v2"] < receipt["sync_payloads_sent"]["v1"]
          assert len(receipt["negative_controls"]) == 5 and all(receipt["negative_controls"].values())
          assert file_map(root / "venue-only-v2") == receipt["original_file_hashes"]["v2"]
          assert all(command["exit_code"] == 0 for command in receipt["commands"])
          for command in receipt["commands"][receipt["venue_only_command_start"]:]:
              assert command["argv"][1:3] == ["--repository", str(root.resolve() / "venue-store")]
              assert "sync" not in command["argv"] and "--from" not in command["argv"]
          print("PASS: incremental kit update, verified selection and venue-only restoration; no network-isolation claim")
          PY
      - name: Restore visible task state and verify two scripted continuations
        run: |
          uv run --no-project --python 3.12 python checkpoint.py --casita output/casita-build/debug/casita --output output/checkpoint
          python - <<'PY'
          import json
          from pathlib import Path
          from demo import file_map
          from checkpoint import BRANCHES, verify_checkpoint, verify_continuation

          root = Path("output/checkpoint")
          receipt = json.loads((root / "receipt.json").read_bytes())
          assert receipt["ok"] and receipt["synthetic"] and receipt["scripted_continuations"]
          assert not receipt["fresh_ai_run"] and not receipt["model_internal_state_restored"]
          assert not receipt["received_instructions_executed"] and not receipt["execution_attested"]
          assert not receipt["network_isolation_enforced"]
          assert receipt["sender_path_unavailable"] and not (root / "sender-store").exists()
          assert receipt["original_checkpoints_removed"] and not (root / "checkpoints").exists()
          assert (root / "sender-store-unavailable").is_dir()
          assert receipt["visible_checkpoint_restored"] and receipt["returned_parent_and_results_verified"]
          assert receipt["integrity_audits_passed"]
          assert receipt["branch_choices"] == {"economy": "park", "full-day": "museum"}
          assert len(receipt["negative_controls"]) == 9 and all(receipt["negative_controls"].values())
          assert all(command["exit_code"] == 0 for command in receipt["commands"])
          for revision in ("v1", "v2"):
              assert file_map(root / "restored" / revision) == receipt["original_file_hashes"][revision]
          parent_pin = receipt["pins"]["v2"]
          assert file_map(root / "verified-parent") == receipt["original_file_hashes"]["v2"]
          verify_checkpoint(root / "verified-parent", parent_pin)
          for branch in BRANCHES:
              folder = root / "verified" / branch
              verify_continuation(folder, receipt["result_pins"][branch], root / "verified-parent", parent_pin, branch)
              result = json.loads((folder / "result.json").read_bytes())
              assert result["pending"] == ["compare-options"]
              assert result["parent_checkpoint_id"] == parent_pin["checkpoint_id"]
              assert result["parent_directory_key"] == parent_pin["directory_key"]
          for command in receipt["commands"][receipt["worker_command_start"]:]:
              assert command["argv"][1] == "--repository"
              assert command["argv"][2] in {str(root.resolve() / store) for store in ("worker-store", "returned-store")}
          print("PASS: exact visible checkpoint and two parent-bound returns; no live model or received instructions executed")
          PY
      - name: Exchange teammate proposals and explicitly select shared knowledge
        run: |
          for teammate in bob carol; do
            uv run --no-project --python 3.12 python team_handoff.py --casita output/casita-build/debug/casita --output "output/teammate-$teammate" --accept "$teammate"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          from demo import file_map
          from team_handoff import STATEMENTS, entry, verify_proposal, verify_snapshot
          from team_handoff_summary import summarize

          for selected in ("bob", "carol"):
              root = Path(f"output/teammate-{selected}")
              receipt = json.loads((root / "receipt.json").read_bytes())
              assert receipt["ok"] and receipt["synthetic"] and receipt["scripted_teammates"]
              assert receipt["selected_proposer"] == selected
              assert receipt["sender_path_unavailable"] and receipt["original_snapshot_removed"]
              assert not (root / "alice-store").exists() and not (root / "original").exists()
              assert receipt["integrity_audits_passed"] and receipt["competing_proposals_retained"]
              assert receipt["selected_snapshot_shared_back"]
              assert receipt["accepted_proposal_shared_back"]
              assert not receipt["proposals_changed_current_knowledge"]
              for field in ("fresh_ai_run", "model_internal_state_restored", "received_instructions_executed",
                            "identity_authenticated", "access_control_tested", "execution_attested",
                            "network_isolation_enforced", "concurrent_writes_tested"):
                  assert receipt[field] is False
              assert len(receipt["negative_controls"]) == 11 and all(receipt["negative_controls"].values())
              assert all(command["exit_code"] == 0 for command in receipt["commands"])
              for path in (root / "bob/context", root / "carol/context", root / "owner/context-v1"):
                  assert file_map(path) == receipt["original_file_hashes"]
              for person in ("bob", "carol"):
                  verify_proposal(root / f"owner/proposals/{person}", receipt["proposal_pins"][person],
                                  root / "owner/context-v1", receipt["input_pin"])
              verified = verify_snapshot(root / "owner/context-v2", receipt["next_pin"])
              assert verified["knowledge"]["entries"] == [entry(STATEMENTS[selected])]
              assert file_map(root / "owner/context-v2") == receipt["next_file_hashes"]
              for person in ("bob", "carol"):
                  path = root / person / "selected-context"
                  assert file_map(path) == receipt["next_file_hashes"]
                  verify_snapshot(path, receipt["next_pin"])
                  proposal = verify_proposal(root / person / "accepted-proposal",
                                             receipt["proposal_pins"][selected], root / person / "context",
                                             receipt["input_pin"])
                  assert verified["knowledge"]["entries"] == [proposal["replacement"]]
              manifest = json.loads((root / "owner/context-v2/manifest.json").read_bytes())
              assert manifest["parent_snapshot_id"] == receipt["input_pin"]["snapshot_id"]
              assert manifest["decision"] == receipt["decision"]
              assert manifest["decision"]["proposal_id"] == receipt["proposal_pins"][selected]["proposal_id"]
              summary = summarize(root)
              assert summary["knowledge"] == [entry(STATEMENTS[selected])]
              assert summary["selected_proposer"] == selected
              assert summary["selected_proposal_id"] == receipt["proposal_pins"][selected]["proposal_id"]
              assert summary["pending"] == ["test-in-a-real-workflow"]
              assert len(summary["proposals"]) == 2
              for proposal in summary["proposals"]:
                  original = verify_proposal(root / f"owner/proposals/{proposal['proposer']}",
                                             receipt["proposal_pins"][proposal["proposer"]],
                                             root / "owner/context-v1", receipt["input_pin"])
                  assert proposal["citation"] == original["citation"]
              assert [p["proposer"] for p in summary["proposals"] if p["status"] == "selected"] == [selected]
          print("PASS: both explicit owner selections, retained competing advice and exact source/parent bindings")
          PY
      - name: Run separate sender, worker and return-verifier processes
        run: |
          python output/ci-worktree/handoff.py prepare --casita output/casita-build/debug/casita --output output/portable-sender
          python output/ci-worktree/handoff.py work --casita output/casita-build/debug/casita --archive output/portable-sender/handoff.casitar --pins output/portable-sender/pins.json --output output/portable-worker
          python output/ci-worktree/handoff.py verify --casita output/casita-build/debug/casita --archive output/portable-worker/handoff.casitar --pins output/portable-worker/pins.json --original output/portable-sender --output output/portable-return
          python - <<'PY'
          import json
          from pathlib import Path
          for role in ("sender", "worker", "return"):
              receipt = json.loads(Path(f"output/portable-{role}/receipt.json").read_text())
              assert receipt["ok"] and all(c["exit_code"] == 0 for c in receipt["commands"])
          worker = json.loads(Path("output/portable-worker/receipt.json").read_text())
          assert worker["verdicts"] == {"v1": "rejected: source or output audio timing unavailable", "v2": "accepted"}
          assert worker["received_code_executed"] is False and worker["execution_attested"] is False
          returned = json.loads(Path("output/portable-return/receipt.json").read_text())
          assert returned["original_contexts_verified"]
          print("PASS: separate-process portable handoff and original-context result verification")
          PY

      - name: Run authenticated input and result handoff
        run: |
          python output/ci-worktree/signed_handoff.py --casita output/casita-build/debug/casita --output output/signed-handoff
          python - <<'PY'
          import json
          from pathlib import Path
          folder = Path("output/signed-handoff")
          receipt = json.loads((folder / "receipt.json").read_text())
          assert receipt["ok"] and receipt["original_contexts_verified"]
          assert receipt["input_authentication"]["verified"] and receipt["result_authentication"]["verified"]
          assert receipt["unsigned_replacement_accepted"] and receipt["throwaway_private_keys_removed"]
          assert receipt["negative_controls"] == {
              "replaced_archive_and_pins": True, "unknown_signing_key": True,
              "wrong_namespace": True, "wrong_identity": True,
          }
          assert not (folder / "throwaway-keys").exists()
          assert receipt["received_code_executed"] is False and receipt["execution_attested"] is False
          assert receipt["verdicts"] == {"v1": "rejected: source or output audio timing unavailable", "v2": "accepted"}
          print("PASS: signed pins, original-context result verification and pre-import signature controls")
          PY

      - name: Replay recorded AI review through signed source and result capsules
        run: |
          python review_replay.py --casita output/casita-build/debug/casita --source output/review-source --report docs/review-report.json --output output/review-replay
          python - <<'PY'
          import json
          from pathlib import Path
          folder = Path("output/review-replay")
          receipt = json.loads((folder / "receipt.json").read_text())
          assert receipt["ok"] and receipt["original_context_verified"] and receipt["citations_verified"]
          assert receipt["input_signature_verified"] and receipt["result_signature_verified"]
          assert receipt["fresh_ai_review"] is False and receipt["review_quality_verified"] is False
          assert receipt["execution_attested"] is False
          assert receipt["finding_count"] == 1
          assert receipt["negative_controls"] == {"wrong_context": True, "invented_excerpt": True}
          assert receipt["throwaway_private_keys_removed"] and not (folder / "throwaway-keys").exists()
          for mode in ("sender", "receiver", "reviewer-return", "verified-return"):
              role = json.loads((folder / mode / "receipt.json").read_text())
              assert role["ok"] and all(c["exit_code"] == 0 for c in role["commands"])
          print("PASS: recorded AI report, signed source/result transport, exact citations and signed invalid-report controls")
          PY

      - name: Run synthetic selected-Git-lines review handoff
        run: |
          python git_review_example.py --casita output/casita-build/debug/casita --output output/git-review-example
          python - <<'PY'
          import json
          from pathlib import Path
          folder = Path("output/git-review-example")
          receipt = json.loads((folder / "receipt.json").read_text())
          assert receipt["ok"] and receipt["synthetic_fixture"]
          assert receipt["fresh_ai_review"] is False and receipt["review_quality_verified"] is False
          assert receipt["received_code_executed"] is False and receipt["execution_attested"] is False
          assert receipt["os_sandbox_enforced"] is False
          assert receipt["original_git_verified"] and receipt["citations_verified"]
          assert receipt["input_signature_verified"] and receipt["result_signature_verified"]
          assert receipt["working_tree_data_excluded"] and receipt["finding_count"] == 1
          assert receipt["negative_controls"] == {
              "wrong_context": True, "wrong_commit": True, "invented_excerpt": True,
              "wrong_blob": True, "uncaptured_lines": True, "modified_pins_before_import": True,
          }
          assert receipt["throwaway_private_keys_removed"] and not (folder / "throwaway-keys").exists()
          for name in ("sender", "receiver", "reviewer-return", "verified-return"):
              role = json.loads((folder / name / "receipt.json").read_text())
              assert role["ok"] and all(c["exit_code"] == 0 for c in role["commands"])
          assert not (folder / "rejected-modified-pins/store").exists()
          print("PASS: synthetic Git selections, signed round trip, exact citations and rejection controls")
          PY

      - name: Prepare numbered review requests and validate a scripted reply offline
        run: |
          python halo_review.py request --context output/git-review-example/receiver --pins output/git-review-example/sender/pins.json --signature output/git-review-example/sender/pins.sig --allowed-signers output/git-review-example/sender-allowed-signers --signer synthetic-sender --source output/git-review-example/synthetic-repository --model synthetic-no-inference --output output/halo-adapter-request
          python halo_review.py validate --request output/halo-adapter-request --request-sha256 "$(cat output/halo-adapter-request/request-sha256.txt)" --response output/git-review-example/report.json --output output/halo-adapter-validated
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("output/halo-adapter-request")
          request = json.loads((root / "request.json").read_text())
          payload = json.loads(request["messages"][1]["content"])
          source = next(item for item in payload["sources"] if item["id"] == "classifier")
          assert [item["line"] for item in source["lines"]] == [3, 4, 5, 6]
          assert not request["allow_download"] and "tools" not in request
          receipt = json.loads((root / "receipt.json").read_text())
          assert receipt["signature_verified"] and receipt["original_git_verified"]
          assert not receipt["inference_performed"]
          returned = Path("output/halo-adapter-validated")
          assert json.loads((returned / "report.json").read_text()) == json.loads(Path("output/git-review-example/report.json").read_text())
